[project]
name = "deevo-mt-framework-backend"
version = "0.1.0"
description = "Deevo Multi-Tenant Framework Backend"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # Database
    "sqlalchemy>=2.0.49",
    "pyodbc>=5.3.0",
    "alembic>=1.18.4",

    # Settings & validation
    "pydantic-settings>=2.14.0",
    "email-validator>=2.3.0",
    "python-dotenv>=1.0.0",

    # Authentication
    "python-jose[cryptography]>=3.3.0",
    # bcrypt 4.1+ breaks passlib 1.7.4 backend detection — keep pinned to 4.0.x
    "bcrypt>=4.0.1,<4.1",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",

    # ULID
    "python-ulid>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mtf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: requires live SQL Server and credentials in .env (set DEEVO_SKIP_DB_TESTS=1 to skip)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]